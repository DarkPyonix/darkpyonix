name: Test

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: One version (kernel, Cargo, binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: darkpyonix/kernel/__init__.py is the source; Cargo.toml must follow
        run: python3 packaging/check_versions.py

  python:
    name: Python (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.8", "3.10", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
    env:
      # Runtime state stays inside the checkout (AGENTS.md "Where files go").
      DARKPYONIX_HOME: ${{ github.workspace }}/.scratch/home
      # NFR-K3 timings are measured on a quiet machine, not on shared runners.
      DARKPYONIX_SKIP_PERF: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the interpreters
        run: uv python install ${{ matrix.python }} 3.13
      - name: Create the test environment
        run: |
          # The harness (pytest) runs on 3.13; the matrix version
          # is the interpreter the kernels run under (NFR-K1).
          uv venv --no-project -p 3.13 .scratch/venv
          # The package is not installed: tests/conftest.py links darkpyonix/kernel as `darkpyonix`
          # under .scratch/src (hatchling cannot do an editable install of a renamed folder).
          uv pip install -p .scratch/venv/bin/python "pytest>=8" "pyyaml>=6" "nbformat>=5" "jsonschema>=4" "hatchling>=1.27"
      - name: Run the suite
        run: |
          # Kernel tests run against the bare interpreter, where darkpyonix is not installed
          # (FR-K1, NFR-K1).
          export DARKPYONIX_TEST_PYTHONS="$(uv python find --no-project ${{ matrix.python }})"
          echo "kernel interpreter: $DARKPYONIX_TEST_PYTHONS"
          .scratch/venv/bin/python -m pytest -ra

  rust:
    name: Rust manager
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: darkpyonix/manager
    env:
      DARKPYONIX_HOME: ${{ github.workspace }}/.scratch/home
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Interpreter for the real-kernel tests
        # manager_latency.rs looks for .venv/bin/python unless DPX_TEST_PYTHON is set.
        run: echo "DPX_TEST_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: darkpyonix/manager
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  python-windows:
    name: Python on Windows (${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.13"]
    env:
      DARKPYONIX_HOME: ${{ github.workspace }}\.scratch\home
      DARKPYONIX_SKIP_PERF: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the test tools
        run: python -m pip install "pytest>=7,<8.4" "pyyaml>=6" "nbformat>=5" "jsonschema>=4"
      - name: Named-pipe control channel (FR-A1, PR-2, PR-5; #80)
        shell: pwsh
        run: |
          # The real-pipe tests must run on Windows; a skip there is a failure.
          python -m pytest -rs -p no:cacheprovider tests/test_fr_a1_windows_pipe.py tests/test_nfr_k2_stdlib_only.py 2>&1 | Tee-Object -FilePath pytest-win.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path pytest-win.log -Pattern "needs a Windows named pipe") {
            Write-Error "real Windows pipe tests were skipped"; exit 1
          }

  rust-windows:
    name: Rust manager on Windows (kernel client)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: darkpyonix/manager
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: darkpyonix/manager
      - name: Named-pipe client (FR-A1; #80)
        run: cargo test -p dpx-kernel test_fr_a1

  hub-worker:
    name: Hub worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: darkpyonix/hub/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: darkpyonix/hub/worker/package-lock.json
      - run: npm ci
      - run: npm test

  hub-server:
    name: Hub server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: darkpyonix/hub/server
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: darkpyonix/hub/server
      - name: Test
        run: cargo test --all-targets

  shell:
    name: Shell tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release sync script
        run: .github/scripts/release/test-sync-release.sh
