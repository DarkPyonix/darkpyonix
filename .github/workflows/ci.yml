name: CI

on:
  workflow_dispatch:

concurrency:
  group: dev-ci
  cancel-in-progress: false

permissions:
  contents: read
  # test-editor-windows.yml downloads Ember's OSE build artifact.
  actions: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit
  service:
    uses: ./.github/workflows/test-service.yml
  editor-windows:
    uses: ./.github/workflows/test-editor-windows.yml
