name: Editor Windows test

# SPEC FR-M9 on Windows (#170). Step 1, a probe: can the VS Code server (Ember's OSE build) listen
# on a named pipe the manager can proxy to, and is that pipe closed to other users? The answer
# goes into FR-M9 before the manager code. Called by ci.yml (dispatch only).

on:
  workflow_call:

permissions:
  contents: read
  actions: read

env:
  # The dpx-ose windows-x64 build of Ember em-train-25 (until an ose-v release exists).
  OSE_RUN: "45547623834"
  OSE_ARTIFACT: dpx-ose-windows-x64

jobs:
  probe:
    name: Editor server named-pipe probe (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the OSE build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download $env:OSE_RUN -R DarkPyonix/darkpyonix-ember -n $env:OSE_ARTIFACT -D "$env:RUNNER_TEMP\ose-dl"
          Get-ChildItem "$env:RUNNER_TEMP\ose-dl"
          $tgz = Get-ChildItem "$env:RUNNER_TEMP\ose-dl\*.tar.gz" | Select-Object -First 1
          $want = (Get-Content "$($tgz.FullName).sha256").Split(' ')[0]
          $got = (Get-FileHash $tgz.FullName -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { throw "sha256 $got, expected $want" }
          New-Item -ItemType Directory "$env:RUNNER_TEMP\ose" | Out-Null
          tar -xzf $tgz.FullName -C "$env:RUNNER_TEMP\ose"
          $dir = (Get-ChildItem "$env:RUNNER_TEMP\ose" -Directory | Select-Object -First 1).FullName
          "OSE_DIR=$dir" | Out-File -Append $env:GITHUB_ENV
          Get-ChildItem "$dir\bin"

      - name: Start the server on a named pipe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $data = "$env:RUNNER_TEMP\ose-data"
          New-Item -ItemType Directory $data | Out-Null
          $sargs = @('--without-connection-token', '--socket-path', '\\.\pipe\dpx-ose-probe',
                    '--server-base-path', '/ide/ose/', '--server-data-dir', $data, '--accept-server-license-terms')
          Start-Process -FilePath "$env:OSE_DIR\bin\dpx-ose-server.cmd" -ArgumentList $sargs -WindowStyle Hidden `
            -RedirectStandardOutput "$env:RUNNER_TEMP\ose-out.log" -RedirectStandardError "$env:RUNNER_TEMP\ose-err.log"
          for ($i = 0; $i -lt 120; $i++) {
            if ([System.IO.Directory]::GetFiles('\\.\pipe\') -contains '\\.\pipe\dpx-ose-probe') { Write-Output "pipe up after $($i/2)s"; exit 0 }
            Start-Sleep -Milliseconds 500
          }
          Get-Content "$env:RUNNER_TEMP\ose-out.log", "$env:RUNNER_TEMP\ose-err.log"
          throw 'the server never made the pipe'

      - name: HTTP over the pipe as the runner user, and its DACL
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $rights = [System.IO.Pipes.PipeAccessRights]'ReadData, WriteData, ReadPermissions'
          $c = New-Object System.IO.Pipes.NamedPipeClientStream('.', 'dpx-ose-probe', $rights,
                 [System.IO.Pipes.PipeOptions]::None, [System.Security.Principal.TokenImpersonationLevel]::None,
                 [System.IO.HandleInheritability]::None)
          $c.Connect(10000)
          Write-Output '== DACL of the pipe the server made'
          $c.GetAccessControl().Access | Format-Table IdentityReference, AccessControlType, PipeAccessRights -AutoSize | Out-String -Width 200
          $w = New-Object System.IO.StreamWriter($c); $w.AutoFlush = $true
          $w.Write("GET /ide/ose/ HTTP/1.1`r`nHost: localhost`r`nConnection: close`r`n`r`n")
          $r = New-Object System.IO.StreamReader($c)
          $status = $r.ReadLine()
          Write-Output "== runner user: $status"
          if ($status -notmatch '^HTTP/1\.1 (200|302)') { throw "unexpected status: $status" }

      - name: The same pipe as another, non-admin user
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pw = 'Dpx-' + [guid]::NewGuid().ToString('N').Substring(0, 16) + '!a1'
          net user dpxprobe $pw /add | Out-Null
          New-Item -ItemType Directory C:\dpxprobe | Out-Null
          icacls C:\dpxprobe /grant 'Everyone:(OI)(CI)F' | Out-Null
          @'
          try {
            $c = New-Object System.IO.Pipes.NamedPipeClientStream('.', 'dpx-ose-probe', [System.IO.Pipes.PipeDirection]::InOut)
            $c.Connect(5000)
            $w = New-Object System.IO.StreamWriter($c); $w.AutoFlush = $true
            $w.Write("GET /ide/ose/ HTTP/1.1`r`nHost: localhost`r`nConnection: close`r`n`r`n")
            "connected: " + (New-Object System.IO.StreamReader($c)).ReadLine() | Out-File C:\dpxprobe\result.txt
          } catch {
            "refused: " + $_.Exception.GetType().Name + ": " + $_.Exception.Message | Out-File C:\dpxprobe\result.txt
          }
          '@ | Out-File C:\dpxprobe\client.ps1
          $cred = New-Object System.Management.Automation.PSCredential('dpxprobe', (ConvertTo-SecureString $pw -AsPlainText -Force))
          Start-Process powershell -Credential $cred -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'C:\dpxprobe\client.ps1' `
            -WorkingDirectory C:\dpxprobe -Wait -LoadUserProfile
          $result = Get-Content C:\dpxprobe\result.txt
          Write-Output "== other user: $result"
          # The probe records the answer; FR-M9 decides from it. Nothing fails here on purpose.

      - name: Server log
        if: always()
        shell: pwsh
        run: Get-Content "$env:RUNNER_TEMP\ose-out.log", "$env:RUNNER_TEMP\ose-err.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
