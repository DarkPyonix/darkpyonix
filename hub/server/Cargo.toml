[package]
name = "darkpyonix-hub"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/DarkPyonix/darkpyonix"
description = "darkpyonix.dev: device registry, address directory, iroh relay, share links and HTTPS names"
publish = false

# Its own workspace: the hub is deployed separately from the manager (manager/Cargo.toml).
[workspace]

[lib]
name = "darkpyonix_hub"
path = "src/lib.rs"

[[bin]]
name = "darkpyonix-hub"
path = "src/main.rs"

[dependencies]
iroh-relay = { version = "1.3", features = ["server"] }
iroh-base = { version = "1.3", features = ["key"] }
iroh-dns = "1.3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring"] }
rustls = { version = "0.23.33", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
data-encoding = "2"
url = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"

[dev-dependencies]
iroh = "1.3"
rcgen = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
serde_yaml_ng = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
