# darkpyonix.dev hub API on Cloudflare Workers (SPEC §10, INTENT D14).
# The iroh relay is NOT here: it runs on the relay host (relay.darkpyonix.dev, hub/server).
name = "darkpyonix-hub"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# The apex only. `relay.darkpyonix.dev` is a DNS-only (grey cloud) record to the relay host,
# and `<name>.darkpyonix.dev` names are not routed to this Worker.
routes = [{ pattern = "darkpyonix.dev", custom_domain = true }]

[vars]
PUBLIC_URL = "https://darkpyonix.dev"
ZONE = "darkpyonix.dev"
RELAY_URL = "https://relay.darkpyonix.dev/"
RELAY_ADMIN_URL = "https://relay.darkpyonix.dev"
GITHUB_ALLOWED_IDS = ""
# Secrets (wrangler secret put <NAME>), never in this file:
#   GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET   GitHub OAuth App (FR-H6)
#   RELAY_SHARED_SECRET                      shared with the relay host (FR-H3)
#   CF_API_TOKEN, CF_ZONE_ID                 Zone -> DNS -> Edit on darkpyonix.dev only (FR-H5)

[[d1_databases]]
binding = "DB"
database_name = "darkpyonix-hub"
database_id = "00000000-0000-0000-0000-000000000000" # replace with `wrangler d1 create darkpyonix-hub`
migrations_dir = "migrations"

# The ash viewer, built by darkpyonix-ash and copied to public/ash/ before deploy.
# Assets answer first; requests with no matching file reach the Worker.
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"

# Unauthenticated writes (PUT /pkarr/{key}, POST /v1/device-links), per key per minute.
[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Expired OAuth transactions, device links, relay passes and sessions.
[triggers]
crons = ["17 * * * *"]

# No Durable Objects today: D1 gives every atomic step the hub needs (single-use rows with
# DELETE ... RETURNING, "only if newer" upserts). If the NFR-N1 measurement lets the relay
# move to Cloudflare Containers (SPEC FR-H3, option B), it is added here:
