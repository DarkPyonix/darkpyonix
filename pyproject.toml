[build-system]
requires = ["pdm-backend>=2.4"]
build-backend = "pdm.backend"

[project]
name = "darkpyonix"
version = "0.1.0"
description = "File-bound, manager-independent Python kernel for AI/ML work by people and agents"
authors = [{name = "DarkPyonix"}]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
# The runtime API and the kernel are standard library only (INTENT §2).
dependencies = []

[project.optional-dependencies]
manager = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "nbformat>=5",
    "jsonschema>=4",
]

[project.scripts]
darkpyonix = "darkpyonix.manager.cli:main"

[tool.pdm.build]
package-dir = "darkpyonix/kernel"
includes = ["darkpyonix/kernel/darkpyonix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
