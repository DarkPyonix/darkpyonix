# darkpyonix.dev hub API on Cloudflare Workers (SPEC §10, INTENT D15).
# The iroh relay is NOT here: it runs on the relay host (relay.darkpyonix.dev, darkpyonix/hub/server).
name = "darkpyonix-hub"
main = "src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# The API host only. `relay.darkpyonix.dev` is a DNS-only (grey cloud) record to the relay host,
# and `<name>.darkpyonix.dev` names are not routed to this Worker.
routes = [{ pattern = "api.darkpyonix.dev", custom_domain = true }]

[vars]
API_URL = "https://api.darkpyonix.dev"
FRONT_URL = "https://darkpyonix.dev"
ZONE = "darkpyonix.dev"
RELAY_URL = "https://relay.darkpyonix.dev/"
RELAY_ADMIN_URL = "https://relay.darkpyonix.dev"
GITHUB_ALLOWED_IDS = ""
# Secrets (wrangler secret put <NAME>), never in this file:
#   GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET   GitHub OAuth App (FR-H6)
#   RELAY_SHARED_SECRET                      shared with the relay host (FR-H3)
#   OPERATOR_SECRET                          notebook takedowns (FR-H19)
#   CF_API_TOKEN, CF_ZONE_ID                 Zone -> DNS -> Edit on darkpyonix.dev only (FR-H5)

[[d1_databases]]
binding = "DB"
database_name = "darkpyonix-hub"
database_id = "00000000-0000-0000-0000-000000000000" # replace with `wrangler d1 create darkpyonix-hub`
migrations_dir = "migrations"

[[r2_buckets]]
binding = "NOTEBOOKS"
bucket_name = "darkpyonix-notebooks"

# The ash viewer, built by darkpyonix-ash and copied to public/ash/ before deploy.
# Assets answer first; requests with no matching file reach the Worker.

# FLATHUB_VERIFICATION_TOKEN: Flathub website verification token (FR-H7).

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"

# Unauthenticated writes (PUT /pkarr/{key}, POST /device-links), per key per minute.
[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# FR-H19 notebook limits, per minute (Workers Rate Limiting periods are 10 or 60 seconds).
# Keys: account id for uploads and creation, client address for anonymous reads.
[[ratelimits]]
name = "PUSH_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "READ_LIMITER"
namespace_id = "1004"
simple = { limit = 300, period = 60 }

# NFR-H2: Workers Logs keeps console output only. Invocation logs record each request's URL,
# and iroh's PkarrResolver puts its (resolve) token in the query of GET /pkarr/{key}. Do not
# add a Logpush job with request URL fields for this Worker either.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false

# Expired OAuth transactions, device links, relay passes and sessions.
[triggers]
crons = ["17 * * * *"]

# No Durable Objects today: D1 gives every atomic step the hub needs (single-use rows with
# DELETE ... RETURNING, "only if newer" upserts). If the NFR-N1 measurement lets the relay
# move to Cloudflare Containers (SPEC FR-H3, option B), it is added here:
