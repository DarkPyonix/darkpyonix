[package]
name = "dpx-server"
description = "HTTP layer of the DarkPyonix manager: manager.openapi.yaml on top of a KernelBackend"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dpx-core.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
tracing.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "json"] }
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "server-graceful", "client-legacy", "http1", "http2", "service"] }
http-body = "1"
http-body-util = "0.1"
bytes = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
rand = "0.9"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "parsing"] }
serde_urlencoded = "0.7"
gethostname = "1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "http2"] }
serde_yaml = "0.9"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tokio-tungstenite = "0.28"
async-trait.workspace = true
