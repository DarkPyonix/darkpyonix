openapi: 3.1.0
info:
  title: DarkPyonix Kernel Manager API
  version: 1.0.0-draft.1
  summary: Discover, launch and drive file-bound DarkPyonix kernels.
  description: |
    The HTTP API every DarkPyonix client uses: IDE extensions (VS Code, IntelliJ), the Ember
    workbench, the ash shared notebook, and the `darkpyonix` CLI that agents call.

    **Model.** A kernel is bound to one notebook file (`.py` / `.pynb`). Its id is derived from
    the file's canonical path, so every client finds the same kernel for the same file without
    coordinating. Kernels outlive managers: any manager of the same OS user discovers running
    kernels and attaches to them.

    **Stopping is interrupting.** `POST /kernels/{kernel_id}/interrupt` raises
    `KeyboardInterrupt` in the running cell and keeps the namespace. Only
    `DELETE /kernels/{kernel_id}?force=true` kills a process.

    **Runs.** Every run is recorded beside the file as
    `__runs__/<file name>/<run_id>.ipynb` (nbformat 4). Outputs in this API use the nbformat 4
    output schema verbatim.

    **Events.** `GET /kernels/{kernel_id}/events` is a Server-Sent Events stream. The SSE `id`
    is the kernel's event sequence number; reconnect with `Last-Event-ID` (or `?since=`) to
    resume without loss while the kernel's replay buffer still holds the events.

    Normative documents: `docs/SPEC.md` (requirements), `docs/PROTOCOL.md` (kernel wire
    protocol), `docs/FORMAT.md` (notebook file format).
  license:
    name: MIT
    url: https://github.com/DarkPyonix/darkpyonix/blob/main/LICENSE
  contact:
    name: DarkPyonix
    url: https://github.com/DarkPyonix/darkpyonix
servers:
  - url: http://127.0.0.1:{port}
    description: Ephemeral manager (port is in ~/.darkpyonix/managers/<pid>.json)
    variables:
      port:
        default: "46881"
  - url: https://{host}
    description: Dedicated manager reached through the main server or darkpyonix.dev
    variables:
      host:
        default: main.example.darkpyonix.dev
security:
  - bearerAuth: []
tags:
  - name: System
    description: Health and manager information.
  - name: Kernels
    description: Discover, start, interrupt, restart and shut down file-bound kernels.
  - name: Runs
    description: Execute a whole file or selected cells, and read run logs.
  - name: Documents
    description: A notebook file's cells with the latest outputs mapped onto them.
  - name: Events
    description: Live kernel events over Server-Sent Events.
  - name: Sharing
    description: Per-kernel share tokens with viewer permissions (dedicated manager).

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        "200":
          description: The manager is up.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}

  /api/v1/manager:
    get:
      tags: [System]
      operationId: getManager
      summary: Manager information
      responses:
        "200":
          description: Mode, version, uptime and the caller's permission.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ManagerInfo"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/kernels:
    get:
      tags: [Kernels]
      operationId: listKernels
      summary: List running kernels
      description: |
        Kernels found by multicast discovery merged with the registry fallback
        (SPEC FR-D1, FR-D2). A share token sees only its own kernel.
      parameters:
        - name: refresh
          in: query
          description: Send a fresh discovery query instead of using the cached view.
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: Running kernels.
          content:
            application/json:
              schema:
                type: object
                required: [kernels]
                properties:
                  kernels:
                    type: array
                    items: {$ref: "#/components/schemas/Kernel"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [Kernels]
      operationId: startKernel
      summary: Start (or attach to) the kernel for a file
      description: |
        Idempotent per file (SPEC FR-M2). Returns `200` with the running kernel if one exists,
        otherwise launches one detached from this manager and returns `201` once it announces
        itself. A second kernel for the same file can never exist (SPEC FR-K3).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StartKernelRequest"}
      responses:
        "200":
          description: The kernel for this file was already running.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Kernel"}
        "201":
          description: A new kernel was launched.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Kernel"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "504":
          description: The kernel did not announce itself within 10 seconds.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /api/v1/kernels/{kernel_id}:
    parameters:
      - $ref: "#/components/parameters/KernelId"
    get:
      tags: [Kernels]
      operationId: getKernel
      summary: Kernel status
      responses:
        "200":
          description: Current kernel information.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Kernel"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Kernels]
      operationId: shutdownKernel
      summary: Shut the kernel down
      description: |
        Graceful by default: interrupts the running cell, finishes the run log, and exits
        (SPEC FR-K8). `force=true` kills the process if it has not exited within 5 seconds;
        it is the only operation that kills a kernel.
      parameters:
        - name: force
          in: query
          schema: {type: boolean, default: false}
      responses:
        "202":
          description: Shutdown started.
          content:
            application/json:
              schema:
                type: object
                required: [shutting_down]
                properties:
                  shutting_down: {type: boolean, const: true}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/kernels/{kernel_id}/interrupt:
    parameters:
      - $ref: "#/components/parameters/KernelId"
    post:
      tags: [Kernels]
      operationId: interruptKernel
      summary: Interrupt the running cell
      description: |
        Raises `KeyboardInterrupt` in the running cell. The namespace, the process and the
        queue are kept (SPEC FR-X4). This is what "stop" means in DarkPyonix.
      responses:
        "200":
          description: Whether anything was running.
          content:
            application/json:
              schema:
                type: object
                required: [interrupted]
                properties:
                  interrupted: {type: boolean}
                  run_id: {$ref: "#/components/schemas/RunId"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/kernels/{kernel_id}/restart:
    parameters:
      - $ref: "#/components/parameters/KernelId"
    post:
      tags: [Kernels]
      operationId: restartKernel
      summary: Restart the kernel
      description: |
        Soft restart clears the namespace in place. Hard restart re-executes the kernel
        process with the same interpreter and arguments; the kernel id is unchanged
        (SPEC FR-K7).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                hard: {type: boolean, default: false}
      responses:
        "200":
          description: Restarted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Kernel"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/kernels/{kernel_id}/namespace:
    parameters:
      - $ref: "#/components/parameters/KernelId"
    get:
      tags: [Kernels]
      operationId: getNamespace
      summary: Inspect user variables
      description: |
        Names, types and short summaries of user variables (SPEC FR-K6). While a cell is
        running only `name` and `type` are filled, so no user `__repr__` runs off the main
        thread.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 200}
      responses:
        "200":
          description: Variables.
          content:
            application/json:
              schema:
                type: object
                required: [variables]
                properties:
                  variables:
                    type: array
                    items: {$ref: "#/components/schemas/Variable"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/kernels/{kernel_id}/document:
    parameters:
      - $ref: "#/components/parameters/KernelId"
    get:
      tags: [Documents]
      operationId: getKernelDocument
      summary: The kernel's file with the latest outputs mapped onto its cells
      description: |
        Parses the file on disk and maps the latest run log onto it by cell `id`, then
        `source_sha256`, then `index` (SPEC FR-R4). `viewer1` receives cells without outputs.
      responses:
        "200":
          description: Cells with outputs.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Document"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/documents:
    get:
      tags: [Documents]
      operationId: getDocument
      summary: Parse any notebook file, with or without a kernel
      description: |
        Same result as `getKernelDocument`, for a file whose kernel is not running. Reads
        `__runs__/` directly. Master token only.
      parameters:
        - name: path
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Cells with outputs from the latest run log, if any.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Document"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/kernels/{kernel_id}/runs:
    parameters:
      - $ref: "#/components/parameters/KernelId"
    get:
      tags: [Runs]
      operationId: listRuns
      summary: List run logs, newest first
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 20}
      responses:
        "200":
          description: Run summaries.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: {$ref: "#/components/schemas/RunSummary"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [Runs]
      operationId: startRun
      summary: Run the whole file or selected cells
      description: |
        With `on_busy: reject` (the default) a request that arrives while another run is
        executing is refused with `409 busy` and the current run in `error.data`; this is what
        stops an agent from running the same file twice (SPEC FR-X3). With `on_busy: queue`
        the run waits its turn.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RunRequest"}
      responses:
        "202":
          description: Accepted. Follow progress on the events stream.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunAccepted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: Another run is executing and `on_busy` is `reject`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BusyError"}

  /api/v1/kernels/{kernel_id}/runs/{run_ref}:
    parameters:
      - $ref: "#/components/parameters/KernelId"
      - name: run_ref
        in: path
        required: true
        description: A run id, or `latest` (newest finished run), or `current` (the run executing now).
        schema:
          oneOf:
            - $ref: "#/components/schemas/RunId"
            - type: string
              enum: [latest, current]
    get:
      tags: [Runs]
      operationId: getRun
      summary: Read one run log
      description: The run log as an nbformat 4 notebook (`format=ipynb`, default) or its summary.
      parameters:
        - name: format
          in: query
          schema: {type: string, enum: [ipynb, summary], default: ipynb}
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RunNotebook"
                  - $ref: "#/components/schemas/RunSummary"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Runs]
      operationId: cancelRun
      summary: Cancel a queued run
      description: Only queued runs can be cancelled. To stop the executing run, interrupt the kernel.
      responses:
        "200":
          description: Whether the run was removed from the queue.
          content:
            application/json:
              schema:
                type: object
                required: [cancelled]
                properties:
                  cancelled: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/kernels/{kernel_id}/events:
    parameters:
      - $ref: "#/components/parameters/KernelId"
    get:
      tags: [Events]
      operationId: streamEvents
      summary: Live kernel events (Server-Sent Events)
      description: |
        Each SSE message has `id: <seq>`, `event: <type>` and `data: <JSON>` where type and data
        are those of `docs/PROTOCOL.md` §3.4. Because `EventSource` cannot set headers, this
        endpoint also accepts `?token=`. Output events are omitted for `viewer1`.
      security:
        - bearerAuth: []
        - tokenQuery: []
      parameters:
        - name: since
          in: query
          description: Replay events after this sequence number. `Last-Event-ID` takes precedence.
          schema: {type: integer, minimum: 0}
        - name: Last-Event-ID
          in: header
          schema: {type: string}
      responses:
        "200":
          description: An endless event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: "SSE frames: `id`, `event`, `data` (JSON of `KernelEvent.data`)."
              example: |
                id: 1043
                event: output
                data: {"run_id":"20261003-142233-a1f0","index":3,"output":{"output_type":"stream","name":"stdout","text":"epoch 1 loss 0.42\n"}}

        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/kernels/{kernel_id}/shares:
    parameters:
      - $ref: "#/components/parameters/KernelId"
    get:
      tags: [Sharing]
      operationId: listShares
      summary: List share tokens of a kernel
      responses:
        "200":
          description: Shares (tokens are never returned again after creation).
          content:
            application/json:
              schema:
                type: object
                required: [shares]
                properties:
                  shares:
                    type: array
                    items: {$ref: "#/components/schemas/Share"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [Sharing]
      operationId: createShare
      summary: Create a share token
      description: Dedicated manager and master token only (SPEC FR-A3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission]
              properties:
                permission: {$ref: "#/components/schemas/SharePermission"}
                label: {type: string, maxLength: 120}
                expires_at: {type: string, format: date-time}
      responses:
        "201":
          description: The share, including its token (shown once).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShareWithToken"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/kernels/{kernel_id}/shares/{share_id}:
    parameters:
      - $ref: "#/components/parameters/KernelId"
      - name: share_id
        in: path
        required: true
        schema: {type: string, pattern: "^s_[0-9a-f]{16}$"}
    delete:
      tags: [Sharing]
      operationId: revokeShare
      summary: Revoke a share token
      responses:
        "204":
          description: Revoked.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        The manager's master token, or a share token. An ephemeral manager writes its master
        token to `~/.darkpyonix/managers/<pid>.json` (mode 0600) for clients of the same OS user.
    tokenQuery:
      type: apiKey
      in: query
      name: token
      description: Accepted only on the events stream and on share links.

  parameters:
    KernelId:
      name: kernel_id
      in: path
      required: true
      description: '`k_` + the first 20 hex digits of SHA-256(canonical path). See PROTOCOL §2.6.'
      schema: {type: string, pattern: "^k_[0-9a-f]{20}$", example: k_3f9a0c1b2d4e5f607182}

  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: Missing or invalid token.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: The token's permission does not allow this operation.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: No such kernel, run or share.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status: {type: string, const: ok}
        version: {type: string, example: 0.1.0}

    ManagerInfo:
      type: object
      required: [version, mode, pid, started_at, permission]
      properties:
        version: {type: string}
        mode: {type: string, enum: [ephemeral, dedicated]}
        pid: {type: integer}
        started_at: {type: string, format: date-time}
        idle_timeout: {type: [integer, "null"], description: Seconds; null for dedicated managers.}
        permission: {$ref: "#/components/schemas/Permission"}
        host: {type: string}

    Permission:
      type: string
      enum: [admin, viewer3, viewer2, viewer1]
      description: |
        `admin` is the master token. Share permissions follow SPEC FR-A3:
        `viewer1` code only; `viewer2` code and run logs; `viewer3` code, run logs and execution.

    SharePermission:
      type: string
      enum: [viewer1, viewer2, viewer3]

    KernelStatus:
      type: string
      enum: [starting, idle, busy, stopping]

    PythonInfo:
      type: object
      required: [version, implementation, executable]
      properties:
        version: {type: string, example: 3.11.9}
        implementation: {type: string, example: CPython}
        executable: {type: string}

    Kernel:
      type: object
      required: [kernel_id, path, pid, status, python, started_at, runs_dir]
      properties:
        kernel_id: {type: string, pattern: "^k_[0-9a-f]{20}$"}
        path: {type: string, description: Canonical absolute path of the notebook file.}
        pid: {type: integer}
        status: {$ref: "#/components/schemas/KernelStatus"}
        run_id: {oneOf: [{$ref: "#/components/schemas/RunId"}, {type: "null"}]}
        queue:
          type: array
          items: {$ref: "#/components/schemas/RunId"}
        execution_count: {type: integer, minimum: 0}
        python: {$ref: "#/components/schemas/PythonInfo"}
        started_at: {type: string, format: date-time}
        host: {type: string}
        kernel_version: {type: string}
        runs_dir: {type: string}

    StartKernelRequest:
      type: object
      required: [path]
      properties:
        path: {type: string, description: Path of a `.py` or `.pynb` file on the manager's machine.}
        python:
          type: string
          description: Interpreter to run the kernel with. Defaults to the manager's own interpreter.
        cwd: {type: string, description: Working directory. Defaults to the file's directory.}
        env:
          type: object
          additionalProperties: {type: string}
          description: Extra environment variables for the kernel process.

    RunId:
      type: string
      pattern: "^[0-9]{8}-[0-9]{6}-[0-9a-f]{4}$"
      example: 20261003-142233-a1f0

    RunRequest:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [all, cells]
          description: "`all` runs the preamble and every cell; `cells` runs the preamble once and then the listed cells."
        cells:
          type: array
          items: {type: integer, minimum: 0}
          description: Cell indexes (preamble is 0). Required when `mode` is `cells`.
        source:
          type: string
          description: Run this text instead of the file on disk (an unsaved editor buffer). Not saved.
        params:
          type: object
          additionalProperties: true
          description: Values for `darkpyonix.params.get(...)`; take precedence over command-line arguments.
        on_busy:
          type: string
          enum: [reject, queue]
          default: reject

    RunAccepted:
      type: object
      required: [run_id, state]
      properties:
        run_id: {$ref: "#/components/schemas/RunId"}
        state: {type: string, enum: [running, queued]}
        position: {type: integer, minimum: 1, description: Queue position when queued.}

    RunStatus:
      type: string
      enum: [queued, running, ok, error, interrupted, cancelled, crashed]

    RunSummary:
      type: object
      required: [run_id, status, mode, started_at]
      properties:
        run_id: {$ref: "#/components/schemas/RunId"}
        status: {$ref: "#/components/schemas/RunStatus"}
        mode: {type: string, enum: [all, cells]}
        cells:
          type: array
          items: {type: integer}
        params: {type: object, additionalProperties: true}
        started_at: {type: string, format: date-time}
        ended_at: {type: [string, "null"], format: date-time}
        duration: {type: [number, "null"], description: Seconds.}
        path: {type: string, description: Absolute path of the run log file.}

    RunNotebook:
      type: object
      description: |
        An nbformat 4.5 notebook. `metadata.darkpyonix` holds the run fields of SPEC FR-R1 and
        every cell's `metadata.darkpyonix` holds `index`, `type`, `title`, `source_sha256`,
        `status`, `started_at`, `ended_at`.
      required: [nbformat, nbformat_minor, metadata, cells]
      properties:
        nbformat: {type: integer, const: 4}
        nbformat_minor: {type: integer}
        metadata: {type: object, additionalProperties: true}
        cells:
          type: array
          items: {type: object, additionalProperties: true}

    BusyError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, data]
          properties:
            code: {type: string, const: busy}
            message: {type: string}
            data:
              type: object
              required: [current]
              properties:
                current: {$ref: "#/components/schemas/RunSummary"}
                queue_length: {type: integer}

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, unauthorized, forbidden, not_found, busy, start_timeout, kernel_unreachable, internal]
            message: {type: string}
            data: {type: object, additionalProperties: true}

    Variable:
      type: object
      required: [name, type]
      properties:
        name: {type: string}
        type: {type: string, example: torch.nn.Module}
        repr: {type: [string, "null"], maxLength: 200}
        shape: {type: [array, "null"], items: {type: integer}}
        dtype: {type: [string, "null"]}
        len: {type: [integer, "null"]}

    CellType:
      type: string
      description: See FORMAT §3. Unknown types are preserved as written.
      examples: [preamble, code, markdown, argparse, binding, shell, parallel, concurrent, cinterop, cppinterop, rustinterop]

    Output:
      type: object
      description: An nbformat 4 output object (`stream`, `display_data`, `execute_result` or `error`), unchanged.
      required: [output_type]
      properties:
        output_type: {type: string, enum: [stream, display_data, execute_result, error]}
      additionalProperties: true

    DocumentCell:
      type: object
      required: [index, type, source, source_sha256, metadata]
      properties:
        index: {type: integer, minimum: 0}
        type: {$ref: "#/components/schemas/CellType"}
        title: {type: [string, "null"]}
        source: {type: string}
        source_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        metadata: {type: object, additionalProperties: true, description: "`# @key: value` lines."}
        outputs:
          type: array
          items: {$ref: "#/components/schemas/Output"}
        execution_count: {type: [integer, "null"]}
        status: {type: [string, "null"], enum: [ok, error, interrupted, null]}
        stale: {type: boolean, description: The outputs came from a different source for this cell.}
        run_id: {oneOf: [{$ref: "#/components/schemas/RunId"}, {type: "null"}]}

    Document:
      type: object
      required: [path, cells]
      properties:
        path: {type: string}
        kernel_id: {type: string}
        file_sha256: {type: string}
        latest_run: {oneOf: [{$ref: "#/components/schemas/RunSummary"}, {type: "null"}]}
        cells:
          type: array
          items: {$ref: "#/components/schemas/DocumentCell"}

    KernelEvent:
      type: object
      description: The `data` of one SSE message. Types and fields follow PROTOCOL §3.4.
      required: [seq, type, time, data]
      properties:
        seq: {type: integer}
        type:
          type: string
          enum: [kernel.status, run.queued, run.started, run.finished, cell.started, cell.finished, output, output.clear, replay_truncated]
        time: {type: string, format: date-time}
        data: {type: object, additionalProperties: true}

    Share:
      type: object
      required: [share_id, kernel_id, permission, created_at]
      properties:
        share_id: {type: string, pattern: "^s_[0-9a-f]{16}$"}
        kernel_id: {type: string}
        permission: {$ref: "#/components/schemas/SharePermission"}
        label: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        expires_at: {type: [string, "null"], format: date-time}

    ShareWithToken:
      allOf:
        - $ref: "#/components/schemas/Share"
        - type: object
          required: [token, url]
          properties:
            token: {type: string, description: Shown only in this response. Stored hashed.}
            url: {type: string, description: Share link, e.g. `https://darkpyonix.dev/s/<share_id>#<token>`.}
